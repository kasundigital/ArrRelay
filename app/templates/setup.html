{% extends 'base.html' %}{% block content %}<div class="login card"><h1>Welcome to ArrRelay</h1><p class="muted">Create the first local administrator account. This account is stored only in ArrRelay's SQLite database.</p>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post"><div class="field"><label>Admin username</label><input name="username" required autofocus></div><div class="field"><label>Password</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>Confirm password</label><input name="confirm" type="password" minlength="8" required></div><button>Create Admin</button></form></div>{% endblock %}
